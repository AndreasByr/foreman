# LiteLLM proxy as one door for worker models: Ollama Cloud only.
# Workers call this proxy with a virtual key; when the proxy is down or a limit is exhausted,
# tools/delegate/run_task.py falls back to `claude -p` on your Claude subscription (fallback_model).
#
# The ChatGPT route is optional and lives in litellm.chatgpt.example.yaml. It needs the human's informed consent
# (install with `--chatgpt-via-gateway accepted-risk`); without that option the file is not installed.
#
# Pin the LiteLLM version. Do not use 1.82.7 or 1.82.8. Check the project's release notes before upgrading.
# Run: litellm --config litellm.config.yaml --port 4000   (behind HTTPS, for example a reverse proxy)
# Replace every <...> placeholder and use exact model IDs from the current Ollama model list.

model_list:
  # task-simple: cheap edits, completion, subagent work
  - model_name: task-simple
    litellm_params:
      model: ollama_chat/<ollama-coding-model-id>
      api_base: https://ollama.com
      api_key: os.environ/OLLAMA_API_KEY

  # task-research: read-only research
  - model_name: task-research
    litellm_params:
      model: ollama_chat/<ollama-research-model-id>
      api_base: https://ollama.com
      api_key: os.environ/OLLAMA_API_KEY

  # task-normal: standard coding
  - model_name: task-normal
    litellm_params:
      model: ollama_chat/<ollama-coding-model-id>
      api_base: https://ollama.com
      api_key: os.environ/OLLAMA_API_KEY

  # task-complex: harder coding
  - model_name: task-complex
    litellm_params:
      model: ollama_chat/<ollama-large-model-id>
      api_base: https://ollama.com
      api_key: os.environ/OLLAMA_API_KEY

  # task-testing: writing and fixing tests
  - model_name: task-testing
    litellm_params:
      model: ollama_chat/<ollama-coding-model-id>
      api_base: https://ollama.com
      api_key: os.environ/OLLAMA_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 1
  request_timeout: 600
  # Never log prompts or answers: they contain your code.
  turn_off_message_logging: true
  redact_user_api_key_info: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY      # admin only, never given to workers
  # database_url: os.environ/DATABASE_URL         # needed for virtual keys; Postgres or SQLite per LiteLLM docs

# Virtual keys (create once with the master key, then give workers only these):
#   curl -X POST https://gateway.example.com/key/generate \
#     -H "Authorization: Bearer $LITELLM_MASTER_KEY" -H "Content-Type: application/json" \
#     -d '{"key_alias":"foreman-workers","models":["task-simple","task-research","task-normal","task-complex","task-testing"],"max_budget":0}'
# The key reaches only the task-* aliases. Put it into the variable named in tools/delegate/config.toml [gateway] api_key_env.
