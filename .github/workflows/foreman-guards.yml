name: foreman guards
on:
  pull_request:
  push:
    branches: [dev, main, "batch/**"]
jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Config check (opusplan, size limits, task files)
        run: bash scripts/check-config.sh
      - name: Push guard tests
        run: python3 scripts/test-guard.py
      - name: Delegate wrapper tests
        run: python3 tools/delegate/test_run_task.py
        if: hashFiles('tools/delegate/test_run_task.py') != ''
      - name: State mirror tests
        run: node scripts/test-state-mirror.mjs
        if: hashFiles('scripts/test-state-mirror.mjs') != ''
      - name: Dispatcher check tests
        run: node scripts/test-autopilot-check.mjs
        if: hashFiles('scripts/test-autopilot-check.mjs') != ''
      - name: Pretest runner tests
        run: node scripts/test-pretest.mjs
        if: hashFiles('scripts/test-pretest.mjs') != ''
      - name: Pre-push hook tests
        run: bash scripts/test-pre-push.sh
        if: hashFiles('scripts/test-pre-push.sh') != ''
      - name: State check tests
        run: node scripts/test-check-state-touched.mjs
        if: hashFiles('scripts/test-check-state-touched.mjs') != ''
      - name: STATE.md changes with the work
        if: github.event_name == 'pull_request' && hashFiles('scripts/check-state-touched.mjs') != ''
        run: node scripts/check-state-touched.mjs --base "origin/$GITHUB_BASE_REF" --head HEAD --head-ref "$GITHUB_HEAD_REF"
